name: Update models.json daily

on:
  schedule:
    # UTC timezone, daily at 06:00
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the model catalog
        run: pnpm fetch-models

      - name: Commit and push updated catalog (if any)
        uses: maxgfr/github-commit-push-file@d030ec3e23928eb9158f07c6f9b89013345fc506 # v0.4.5
        with:
          commit_name: "chore(models): refresh public/models.json (scheduled)"
